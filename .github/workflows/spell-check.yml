name: Spell Check

# See: https://docs.github.com/en/free-pro-team@latest/actions/reference/events-that-trigger-workflows
on:
  push:
  pull_request:
  schedule:
    # Run every Tuesday at 8 AM UTC to catch new misspelling detections resulting from dictionary updates.
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: codespell-project/actions-codespell@master
        with:
          # Only scan the repository source files you maintain to avoid third-party/compiled noise
          # Adjust the list if you keep other content directories under source control
          args: "--check-filenames projects notes resources about.md contact.md index.md README.md assets/**/*.css assets/**/*.js _layouts _includes"
